<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗渊 · 素宣 + 印章 demo</title>
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---- 宣纸纹理与整体基调 ---- */
    html, body {
      background: var(--paper);
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E"),
        radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--gold) 5%, transparent), transparent 40%),
        radial-gradient(circle at 82% 78%, color-mix(in srgb, var(--jade) 4%, transparent), transparent 42%);
      background-attachment: fixed;
    }

    /* 去掉圆角，让元素像纸/印 */
    .site-header, .chip, .card, .more-btn, .searchbox input, .daily {
      border-radius: 0 !important;
    }

    /* ---- 印章式标签 ---- */
    .seal-bar {
      display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
      margin: 28px 0 34px;
    }
    .seal-chip {
      font-family: var(--serif);
      font-size: 13px; letter-spacing: 2px;
      padding: 4px 5px;
      min-width: 38px; text-align: center;
      border: 1.5px solid var(--line);
      color: var(--ink-soft);
      background: color-mix(in srgb, var(--paper-hi) 80%, transparent);
      cursor: pointer;
      transition: all .18s;
      position: relative;
    }
    .seal-chip::after {
      content: "";
      position: absolute; inset: 2px;
      border: 1px dashed color-mix(in srgb, var(--line) 60%, transparent);
      pointer-events: none;
    }
    .seal-chip:hover { border-color: var(--cinnabar-soft); color: var(--cinnabar); }
    .seal-chip.active {
      background: var(--cinnabar); color: var(--seal-ink); border-color: var(--cinnabar);
      box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--cinnabar-soft) 70%, transparent);
      transform: rotate(-1deg);
    }
    .seal-chip.active::after { display: none; }

    /* ---- 首页：竖排 + 墨显动画 ---- */
    .daily {
      min-height: calc(100vh - 220px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 20px 60px;
    }
    .daily-seal {
      writing-mode: vertical-rl;
      font-size: 12px; letter-spacing: 6px;
      color: var(--cinnabar);
      border: 1px solid var(--cinnabar);
      padding: 10px 5px; margin-bottom: 38px;
      opacity: .8;
    }
    .daily-text {
      writing-mode: vertical-rl; text-orientation: upright;
      max-height: 58vh;
      cursor: pointer;
    }
    .daily-text p {
      margin: 0; font-size: 22px; letter-spacing: 6px; line-height: 2.2;
      color: var(--ink);
      opacity: 0;
      animation: ink-in 1.1s ease forwards;
    }
    .daily-text p:nth-child(1) { animation-delay: .1s; }
    .daily-text p:nth-child(2) { animation-delay: .35s; }
    .daily-text p:nth-child(3) { animation-delay: .6s; }
    .daily-text p:nth-child(4) { animation-delay: .85s; }
    @keyframes ink-in {
      0%   { opacity: 0; filter: blur(2px); transform: translateY(8px); }
      60%  { opacity: .85; filter: blur(0); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .daily-text:hover p { color: var(--cinnabar); }
    .daily-attr {
      margin-top: 34px; color: var(--gold); font-size: 12px; letter-spacing: 3px;
    }
    .daily-acts {
      margin-top: 28px; display: flex; gap: 18px; align-items: center;
      font-size: 12px; letter-spacing: 3px; color: var(--ink-soft);
    }
    .daily-acts span { cursor: pointer; border-bottom: 1px solid transparent; transition: .18s; }
    .daily-acts span:hover { color: var(--cinnabar); border-bottom-color: var(--cinnabar); }

    /* 提示条 */
    .demo-note {
      position: fixed; bottom: 12px; right: 14px;
      background: var(--paper-hi); border: 1px solid var(--line);
      padding: 8px 12px; font-size: 11px; letter-spacing: 1px;
      color: var(--ink-soft); z-index: 2000;
    }
  </style>
</head>
<body>
  <div class="tabstrip">
    <div class="tabrow tabrow-works">
      <a class="tabstrip-tab active" href="demo-texture.html">诗渊</a>
      <a class="tabstrip-tab" href="https://classicalchinesepainting.com/">千里江山图</a>
    </div>
  </div>

  <header class="site-header">
    <div class="brand"><h1>诗渊</h1><span class="brand-sub">收录 4300 篇</span></div>
    <nav class="tabs" style="margin-left:auto">
      <button class="active">首页</button>
      <button>诗文库</button>
      <button>作者</button>
      <button>体裁</button>
      <button>主题</button>
      <button>时间轴</button>
    </nav>
    <div class="searchbox"><input type="search" placeholder="搜索标题或作者…"></div>
  </header>

  <main style="max-width:980px;margin:0 auto">
    <!-- 印章式朝代筛选 -->
    <div class="seal-bar">
      <div class="seal-chip active">全</div>
      <div class="seal-chip">先</div>
      <div class="seal-chip">唐</div>
      <div class="seal-chip">宋</div>
      <div class="seal-chip">元</div>
      <div class="seal-chip">清</div>
    </div>

    <section class="daily">
      <div class="daily-seal">詩淵</div>
      <div class="daily-text">
        <p>春眠不觉晓</p>
        <p>处处闻啼鸟</p>
        <p>夜来风雨声</p>
        <p>花落知多少</p>
      </div>
      <div class="daily-attr">唐　孟浩然　《春晓》</div>
      <div class="daily-acts">
        <span>释文</span>
        <span>换一篇</span>
        <span>推荐一幅画</span>
      </div>
    </section>
  </main>

  <div class="demo-note">demo：宣纸纹理 + 印章标签 + 竖排墨显</div>
</body>
</html>
