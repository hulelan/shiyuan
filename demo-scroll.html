<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗渊 · 手卷 demo</title>
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { background: #e8e4dc; }
    body { margin: 0; }
    .page { padding-top: 36px; min-height: 100vh; display: flex; flex-direction: column; }

    .intro {
      text-align: center; color: var(--ink-soft); font-size: 12px; letter-spacing: 2px;
      margin: 18px 0 10px;
    }

    /* ---- 卷轴容器 ---- */
    .scroll-case {
      flex: 1;
      display: flex; align-items: center;
      padding: 30px 0;
    }
    .scroll {
      display: flex; align-items: stretch;
      width: 100%; height: 72vh; min-height: 480px;
      background: linear-gradient(180deg, #8b5e3c 0, #6f452d 8%, transparent 8%, transparent 92%, #6f452d 92%, #8b5e3c 100%);
      padding: 18px 0;
      position: relative;
    }
    .roller {
      flex: none; width: 28px;
      background: linear-gradient(90deg, #5c3a24, #8b5e3c 40%, #a87b56 60%, #5c3a24);
      border-radius: 14px;
      box-shadow: inset 0 0 6px rgba(0,0,0,.35), 2px 0 8px rgba(0,0,0,.25);
      z-index: 2;
    }
    .paper {
      flex: 1;
      overflow-x: auto; overflow-y: hidden;
      white-space: nowrap;
      background:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E"),
        linear-gradient(180deg, var(--paper) 0%, #f7f4ed 50%, var(--paper) 100%);
      background-attachment: local, scroll;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding: 0 60px;
      display: flex; align-items: center;
      gap: 0;
      direction: rtl; /* 从右向左排 */
    }
    .paper::-webkit-scrollbar { height: 8px; }
    .paper::-webkit-scrollbar-thumb { background: var(--cinnabar-soft); border-radius: 4px; }

    .poem-col {
      direction: ltr;
      display: inline-flex; flex-direction: column; align-items: center;
      writing-mode: vertical-rl; text-orientation: upright;
      height: 78%; padding: 0 42px;
      scroll-snap-align: center;
      border-left: 1px dashed var(--line);
    }
    .poem-col:first-child { border-right: 1px dashed var(--line); }
    .poem-col h3 {
      font-size: 20px; letter-spacing: 4px; color: var(--cinnabar); margin: 0 0 18px;
    }
    .poem-col .au { font-size: 12px; color: var(--gold); letter-spacing: 2px; margin-bottom: 26px; }
    .poem-col p {
      font-size: 19px; letter-spacing: 5px; line-height: 2.1; color: var(--ink);
      margin: 0 8px 0 0;
    }

    .hint {
      text-align: center; color: var(--gold); font-size: 11px; letter-spacing: 2px;
      margin: 12px 0 20px;
    }
    .demo-note {
      position: fixed; bottom: 12px; right: 14px;
      background: var(--paper-hi); border: 1px solid var(--line);
      padding: 8px 12px; font-size: 11px; letter-spacing: 1px;
      color: var(--ink-soft); z-index: 2000;
    }
  </style>
</head>
<body>
  <div class="tabstrip">
    <div class="tabrow tabrow-works">
      <a class="tabstrip-tab active" href="demo-scroll.html">诗渊</a>
      <a class="tabstrip-tab" href="https://classicalchinesepainting.com/">千里江山图</a>
    </div>
  </div>

  <div class="page">
    <div class="intro">横向拖动卷轴，从右向左读诗</div>
    <div class="scroll-case">
      <div class="scroll">
        <div class="roller"></div>
        <div class="paper" id="paper">
          <!--  poems are written RTL because .paper has direction: rtl -->
          <div class="poem-col">
            <h3>春晓</h3><div class="au">孟浩然</div>
            <p>春眠不觉晓</p><p>处处闻啼鸟</p><p>夜来风雨声</p><p>花落知多少</p>
          </div>
          <div class="poem-col">
            <h3>静夜思</h3><div class="au">李白</div>
            <p>床前明月光</p><p>疑是地上霜</p><p>举头望明月</p><p>低头思故乡</p>
          </div>
          <div class="poem-col">
            <h3>登鹳雀楼</h3><div class="au">王之涣</div>
            <p>白日依山尽</p><p>黄河入海流</p><p>欲穷千里目</p><p>更上一层楼</p>
          </div>
          <div class="poem-col">
            <h3>相思</h3><div class="au">王维</div>
            <p>红豆生南国</p><p>春来发几枝</p><p>愿君多采撷</p><p>此物最相思</p>
          </div>
        </div>
        <div class="roller"></div>
      </div>
    </div>
    <div class="hint">卷轴 · 竖排 · 横向展开</div>
  </div>

  <div class="demo-note">demo：手卷式横向展开首页</div>
  <script>
    // 自动滚动到最右端（传统阅读起点）
    var p = document.getElementById('paper');
    p.scrollLeft = p.scrollWidth;
  </script>
</body>
</html>
