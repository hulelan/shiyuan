<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗渊 · 古诗古文集</title>
  <meta name="description" content="古诗古文在线库 — 原文、拼音、译文、注释、赏析、英译，并可按朝代、作者、体裁、主题、字词、时间与地理探索。">
  <!-- Leaflet 不进 <head>：按需加载（首次打开地图才注入，见 js/app.js 的 loadLeaflet()）。
       它原来是这里唯一的第三方渲染阻塞依赖，首页不为一张地图等 CDN。 -->
  <link rel="stylesheet" href="css/shell.css?b=c244f4a">
  <link rel="stylesheet" href="css/fonts.css?b=c244f4a">
  <link rel="stylesheet" href="css/style.css?b=c244f4a">
</head>
<body>
  <!-- cross-site tab strip -->
  <div class="tabstrip" id="tabstrip">
    <div class="tabrow tabrow-works">
      <a class="tabstrip-tab active" href="index.html">诗渊</a>
      <a class="tabstrip-tab" href="https://classicalchinesepainting.com/">画　匣</a>
    </div>
  </div>

  <header class="site-header">
    <div class="brand" role="button" tabindex="0">
      <h1>诗渊</h1>
      <span class="brand-sub" id="bootStat">古诗古文 · 溯源</span>
    </div>
    <!-- 顶栏只留首页；其余七种看法收进「更多视角」。
         菜单项由 js/app.js 生成 —— 那里已经有一份视图清单，
         再在这里抄一遍，早晚会跟它对不上。 -->
    <nav class="tabs" id="viewTabs">
      <button data-view="home" class="active">首页</button>
      <div class="lens" id="lens">
        <button class="lens-btn" id="lensBtn" aria-haspopup="true" aria-expanded="false"
                aria-controls="lensMenu">更多视角<span class="lens-caret">▾</span></button>
        <div class="lens-menu" id="lensMenu" role="menu" hidden></div>
      </div>
    </nav>
    <div class="searchbox">
      <input type="search" id="search" placeholder="搜索标题或作者…" autocomplete="off">
    </div>
    <!-- 只换界面语言，诗文不译。字号压到最小，不跟导航抢位置。 -->
    <button class="lang-toggle" id="langToggle" title="Read the interface in English">EN</button>
  </header>

  <main id="main">
    <section class="view" id="view-home"></section>
    <section class="view hidden" id="view-library"></section>
    <section class="view hidden" id="view-authors"></section>
    <section class="view hidden" id="view-author"></section>
    <section class="view hidden" id="view-type"></section>
    <section class="view hidden" id="view-theme"></section>
    <section class="view hidden" id="view-word"></section>
    <section class="view hidden" id="view-timeline"></section>
    <section class="view hidden" id="view-map"></section>
    <section class="view hidden" id="view-art"></section>
    <section class="view hidden" id="view-search"></section>
  </main>

  <!-- 详情浮层 -->
  <div class="overlay hidden" id="overlay">
    <div class="poem-detail" id="poemDetail"></div>
  </div>

  <footer class="site-footer">
    文本仅供学习研究之用
  </footer>

  <script>
  /* 字体试装：?font=a…g 换一副，记在本机。d（Avenir + 苹方）是现行的默认，
     所以 ?font=d 等于清掉试装。这几个类只重定义 --ui / --serif，全站跟着走。 */
  (function () {
    var m = /[?&]font=([a-g])/.exec(location.search);
    if (m) { try { localStorage.setItem("sy_font", m[1]); } catch (e) {} }
    var f = m ? m[1] : (function(){ try { return localStorage.getItem("sy_font"); } catch(e){ return null; } })();
    if (f && f !== "d") {
      document.body.classList.add("font-" + f);
      /* 试装期间挂个角标。七副里有几副换页之后光凭眼睛分不出来，
         不标出来就只能靠猜。?font=d 回到默认，角标随之消失。 */
      var NAME = { a: "Spectral + 宋体", b: "系统无衬线", c: "Helvetica + 黑体",
                   e: "Georgia + 宋体", f: "Verdana", g: "Optima" };
      var tag = document.createElement("div");
      tag.id = "fontTag";
      tag.textContent = f.toUpperCase() + " · " + (NAME[f] || "");
      document.body.appendChild(tag);
    }
  })();
  </script>
  <script src="js/i18n.js?b=c244f4a"></script>
  <script src="js/store.js?b=c244f4a"></script>
  <script src="js/app.js?b=c244f4a"></script>
</body>
</html>
