<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗渊 · 手卷设色 demo</title>
  <link rel="stylesheet" href="css/shell.css">
  <style>
    :root {
      /* 素宣 */
      --ink: #14120e; --ink-soft: #5a554a; --paper: #f7f4ed; --paper-2: #efeadf;
      --cinnabar: #9c2b22; --gold: #9a8f79; --line: #ddd6c7; --jade: #5f6b5c;
    }
    [data-theme="mumo"] {
      /* 暮荷：暮色里的柔紫 */
      --ink: #261c24; --ink-soft: #5e4f59; --paper: #f0edf1; --paper-2: #e6e0e6;
      --cinnabar: #8b3a4a; --gold: #9c8796; --line: #d8cfda; --jade: #5d6b6b;
    }
    [data-theme="summer"] {
      /* 夏昼：明亮暖白 */
      --ink: #1f1c16; --ink-soft: #625c52; --paper: #faf6ec; --paper-2: #f3ecd9;
      --cinnabar: #c45c2e; --gold: #c4a35a; --line: #e6dbbf; --jade: #5d7a5d;
    }
    [data-theme="qinglv"] {
      /* 青绿：石青石绿 */
      --ink: #17201b; --ink-soft: #45544c; --paper: #eef0e8; --paper-2: #e2e7db;
      --cinnabar: #a3392c; --gold: #6f8a86; --line: #c9d3c4; --jade: #2d6b5e;
    }
    html, body { background: var(--paper); transition: background .6s, color .6s; }
    body { margin: 0; font-family: "Songti SC", "STSong", serif; color: var(--ink); }

    .page { padding-top: 36px; min-height: 100vh; display: flex; flex-direction: column; }

    .theme-bar {
      display: flex; justify-content: center; gap: 18px;
      padding: 22px 0 8px;
    }
    .theme-seal {
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid var(--line);
      background: var(--paper-2);
      color: var(--ink-soft);
      font-size: 12px; letter-spacing: 1px;
      cursor: pointer; transition: .2s;
    }
    .theme-seal:hover { border-color: var(--cinnabar-soft); color: var(--cinnabar); }
    .theme-seal.active {
      background: var(--cinnabar); color: var(--paper); border-color: var(--cinnabar);
      transform: rotate(-2deg);
    }

    .intro {
      text-align: center; color: var(--ink-soft); font-size: 12px; letter-spacing: 2px;
      margin: 6px 0 16px;
    }

    .scroll-case {
      flex: 1; display: flex; align-items: center; padding: 20px 0;
    }
    .scroll {
      display: flex; align-items: stretch; width: 100%; height: 68vh; min-height: 420px;
      background: linear-gradient(180deg, #8b5e3c 0, #6f452d 6%, transparent 6%, transparent 94%, #6f452d 94%, #8b5e3c 100%);
      padding: 16px 0; position: relative;
    }
    .roller {
      flex: none; width: 26px;
      background: linear-gradient(90deg, #5c3a24, #8b5e3c 40%, #a87b56 60%, #5c3a24);
      border-radius: 13px; box-shadow: inset 0 0 6px rgba(0,0,0,.35), 2px 0 8px rgba(0,0,0,.25);
      z-index: 2;
    }
    .paper {
      flex: 1; overflow-x: auto; overflow-y: hidden; white-space: nowrap;
      background:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E"),
        linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 50%, var(--paper) 100%);
      background-attachment: local, scroll;
      scroll-snap-type: x mandatory; padding: 0 50px;
      display: flex; align-items: center; gap: 0; direction: rtl;
    }
    .poem-col {
      direction: ltr;
      display: inline-flex; flex-direction: column; align-items: center;
      writing-mode: vertical-rl; text-orientation: upright;
      height: 80%; padding: 0 38px; scroll-snap-align: center;
      border-left: 1px dashed var(--line); transition: border-color .6s;
    }
    .poem-col:first-child { border-right: 1px dashed var(--line); }
    .poem-col h3 { font-size: 20px; letter-spacing: 4px; color: var(--cinnabar); margin: 0 0 16px; transition: color .6s; }
    .poem-col .au { font-size: 12px; color: var(--gold); letter-spacing: 2px; margin-bottom: 22px; transition: color .6s; }
    .poem-col p { font-size: 18px; letter-spacing: 5px; line-height: 2.1; color: var(--ink); margin: 0 8px 0 0; transition: color .6s; }

    .hint { text-align: center; color: var(--gold); font-size: 11px; letter-spacing: 2px; margin: 10px 0 20px; }
    .demo-note {
      position: fixed; bottom: 12px; right: 14px;
      background: var(--paper-2); border: 1px solid var(--line);
      padding: 8px 12px; font-size: 11px; letter-spacing: 1px;
      color: var(--ink-soft); z-index: 2000;
    }
  </style>
</head>
<body data-theme="su">
  <div class="tabstrip">
    <div class="tabrow tabrow-works">
      <a class="tabstrip-tab active" href="demo-themes.html">诗渊</a>
      <a class="tabstrip-tab" href="https://classicalchinesepainting.com/">千里江山图</a>
    </div>
  </div>

  <div class="page">
    <div class="theme-bar">
      <div class="theme-seal active" data-set="su">素宣</div>
      <div class="theme-seal" data-set="mumo">暮荷</div>
      <div class="theme-seal" data-set="summer">夏昼</div>
      <div class="theme-seal" data-set="qinglv">青绿</div>
    </div>
    <div class="intro">点击上方印章切换手卷设色</div>

    <div class="scroll-case">
      <div class="scroll">
        <div class="roller"></div>
        <div class="paper" id="paper">
          <div class="poem-col"><h3>春晓</h3><div class="au">孟浩然</div><p>春眠不觉晓</p><p>处处闻啼鸟</p><p>夜来风雨声</p><p>花落知多少</p></div>
          <div class="poem-col"><h3>静夜思</h3><div class="au">李白</div><p>床前明月光</p><p>疑是地上霜</p><p>举头望明月</p><p>低头思故乡</p></div>
          <div class="poem-col"><h3>登鹳雀楼</h3><div class="au">王之涣</div><p>白日依山尽</p><p>黄河入海流</p><p>欲穷千里目</p><p>更上一层楼</p></div>
          <div class="poem-col"><h3>相思</h3><div class="au">王维</div><p>红豆生南国</p><p>春来发几枝</p><p>愿君多采撷</p><p>此物最相思</p></div>
          <div class="poem-col"><h3>江雪</h3><div class="au">柳宗元</div><p>千山鸟飞绝</p><p>万径人踪灭</p><p>孤舟蓑笠翁</p><p>独钓寒江雪</p></div>
        </div>
        <div class="roller"></div>
      </div>
    </div>
    <div class="hint">手卷 · 竖排 · 横向展开</div>
  </div>

  <div class="demo-note">demo：手卷 + 多套设色切换</div>
  <script>
    function setTheme(name){
      document.querySelectorAll('.theme-seal').forEach(function(x){ x.classList.toggle('active', x.getAttribute('data-set') === name); });
      document.body.setAttribute('data-theme', name);
    }
    document.querySelectorAll('.theme-seal').forEach(function(b){
      b.addEventListener('click', function(){ setTheme(b.getAttribute('data-set')); });
    });
    var params = new URLSearchParams(location.search);
    var initial = params.get('theme') || 'su';
    setTheme(initial);
    var p = document.getElementById('paper');
    p.scrollLeft = p.scrollWidth;
  </script>
</body>
</html>
