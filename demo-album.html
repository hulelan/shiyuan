<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗渊 · 册页式诗画对读 demo</title>
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { background: #e6e2d8; }
    .page { padding-top: 36px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .intro { color: var(--ink-soft); font-size: 12px; letter-spacing: 2px; margin: 18px 0 16px; }

    /* ---- 册页 ---- */
    .album {
      width: min(92vw, 980px); aspect-ratio: 3 / 2;
      background:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E"),
        linear-gradient(160deg, #fcfaf5, #f2eee4);
      border: 1px solid #d6cfc2;
      box-shadow: 0 18px 50px rgba(40,34,22,.18);
      display: flex; overflow: hidden;
      position: relative;
    }
    .leaf { display: none; width: 100%; height: 100%; }
    .leaf.active { display: flex; animation: leaf-in .5s ease; }
    @keyframes leaf-in { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; } }

    .leaf-img {
      flex: 1.45; min-width: 0;
      background-size: cover; background-position: center;
      border-right: 1px solid var(--line);
      position: relative;
    }
    .leaf-img::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.08), transparent 18%);
    }
    .leaf-cap {
      position: absolute; bottom: 14px; left: 14px;
      color: rgba(255,255,255,0.9); font-size: 11px; letter-spacing: 1px;
      text-shadow: 0 1px 3px rgba(0,0,0,.4);
    }

    .leaf-txt {
      flex: 1; min-width: 260px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 30px;
      writing-mode: vertical-rl; text-orientation: upright;
    }
    .leaf-txt h3 { font-size: 22px; letter-spacing: 4px; color: var(--cinnabar); margin: 0 0 18px; }
    .leaf-txt .au { font-size: 12px; color: var(--gold); letter-spacing: 2px; margin-bottom: 26px; }
    .leaf-txt p { font-size: 18px; letter-spacing: 5px; line-height: 2.1; color: var(--ink); margin: 0 8px 0 0; }

    /* ---- 翻页 ---- */
    .nav {
      display: flex; align-items: center; gap: 18px;
      margin-top: 22px;
    }
    .nav button {
      font-family: var(--serif); font-size: 13px; letter-spacing: 2px;
      background: var(--paper-hi); border: 1px solid var(--line); color: var(--ink-soft);
      padding: 6px 18px; cursor: pointer; transition: .18s;
    }
    .nav button:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
    .dots { display: flex; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); cursor: pointer; }
    .dot.active { background: var(--cinnabar); }

    .demo-note {
      position: fixed; bottom: 12px; right: 14px;
      background: var(--paper-hi); border: 1px solid var(--line);
      padding: 8px 12px; font-size: 11px; letter-spacing: 1px;
      color: var(--ink-soft); z-index: 2000;
    }
  </style>
</head>
<body>
  <div class="tabstrip">
    <div class="tabrow tabrow-works">
      <a class="tabstrip-tab active" href="demo-album.html">诗渊</a>
      <a class="tabstrip-tab" href="https://classicalchinesepainting.com/">千里江山图</a>
    </div>
  </div>

  <div class="page">
    <div class="intro">册页式诗画对读 · 左右翻动</div>

    <div class="album" id="album">
      <div class="leaf active">
        <div class="leaf-img" style="background-image:url('assets/art/e025a1267aa1.jpg')">
          <div class="leaf-cap">王希孟 · 千里江山图 · 局部</div>
        </div>
        <div class="leaf-txt">
          <h3>题西林壁</h3><div class="au">苏轼</div>
          <p>横看成岭侧成峰</p><p>远近高低各不同</p><p>不识庐山真面目</p><p>只缘身在此山中</p>
        </div>
      </div>
      <div class="leaf">
        <div class="leaf-img" style="background:linear-gradient(160deg,#e8dfe8 0%,#c9b8c9 40%,#9a879a 100%)">
          <div class="leaf-cap">暮色荷池 · 意象</div>
        </div>
        <div class="leaf-txt">
          <h3>晓出净慈寺送林子方</h3><div class="au">杨万里</div>
          <p>毕竟西湖六月中</p><p>风光不与四时同</p><p>接天莲叶无穷碧</p><p>映日荷花别样红</p>
        </div>
      </div>
      <div class="leaf">
        <div class="leaf-img" style="background:linear-gradient(180deg,#d4e4e0 0%,#8fb3ad 50%,#4a6b5a 100%)">
          <div class="leaf-cap">青绿山水 · 意象</div>
        </div>
        <div class="leaf-txt">
          <h3>望庐山瀑布</h3><div class="au">李白</div>
          <p>日照香炉生紫烟</p><p>遥看瀑布挂前川</p><p>飞流直下三千尺</p><p>疑是银河落九天</p>
        </div>
      </div>
    </div>

    <div class="nav">
      <button id="prev">‹ 上一页</button>
      <div class="dots" id="dots"></div>
      <button id="next">下一页 ›</button>
    </div>
  </div>

  <div class="demo-note">demo：册页式诗画对读</div>

  <script>
    var leaves = document.querySelectorAll('.leaf');
    var dotsBox = document.getElementById('dots');
    leaves.forEach(function(_, i){
      var d = document.createElement('div'); d.className = 'dot' + (i===0?' active':'');
      d.addEventListener('click', function(){ go(i); }); dotsBox.appendChild(d);
    });
    var cur = 0;
    function go(i){
      cur = (i + leaves.length) % leaves.length;
      leaves.forEach(function(l, idx){ l.classList.toggle('active', idx === cur); });
      document.querySelectorAll('.dot').forEach(function(d, idx){ d.classList.toggle('active', idx === cur); });
    }
    document.getElementById('prev').addEventListener('click', function(){ go(cur-1); });
    document.getElementById('next').addEventListener('click', function(){ go(cur+1); });
  </script>
</body>
</html>
