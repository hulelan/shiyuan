<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗渊 · 设计实验室</title>
  <meta name="description" content="诗渊网站设计方向对比与投票页面">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      background: var(--paper);
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      background-attachment: fixed;
    }

    .lab-wrap { max-width: 1200px; margin: 0 auto; padding: 24px 22px 80px; }

    .lab-head { text-align: center; margin: 16px 0 30px; }
    .lab-head h1 { font-size: 26px; letter-spacing: 8px; color: var(--cinnabar); margin: 0 0 10px; }
    .lab-head p { color: var(--ink-soft); font-size: 13px; letter-spacing: 1px; line-height: 1.9; margin: 0; }

    .share-row { text-align: center; margin-bottom: 28px; }
    .share-row button {
      font-family: var(--serif); font-size: 12px; letter-spacing: 2px;
      background: var(--paper-hi); border: 1px solid var(--line); color: var(--ink-soft);
      padding: 6px 18px; cursor: pointer; transition: .18s;
    }
    .share-row button:hover { border-color: var(--cinnabar); color: var(--cinnabar); }

    /* ---- 投票排行 ---- */
    .rank-panel {
      background: linear-gradient(160deg, var(--paper-hi), var(--paper-lo));
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 18px 22px 22px;
      margin-bottom: 34px;
    }
    .rank-panel h2 { margin: 0 0 16px; font-size: 14px; letter-spacing: 4px; color: var(--cinnabar); text-align: center; }
    .rank-empty { text-align: center; color: var(--ink-soft); font-size: 12px; letter-spacing: 1px; }
    .rank-item { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .rank-name { width: 150px; font-size: 12px; color: var(--ink-soft); letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank-bar-wrap { flex: 1; height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
    .rank-bar { height: 100%; background: var(--cinnabar); width: 0; transition: width .4s ease; }
    .rank-count { width: 30px; text-align: right; font-size: 12px; color: var(--gold); }

    /* ---- 设计卡片网格 ---- */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
    .dcard {
      background: linear-gradient(160deg, var(--paper-hi), var(--paper-lo));
      border: 1px solid var(--line);
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(50,40,25,.08);
      transition: transform .2s, box-shadow .2s;
      display: flex; flex-direction: column;
    }
    .dcard:hover { transform: translateY(-4px); box-shadow: 0 10px 26px rgba(50,40,25,.14); }
    .dcard-img { width: 100%; height: 180px; object-fit: cover; display: block; border-bottom: 1px solid var(--line); }
    .dcard-body { padding: 16px 16px 18px; flex: 1; display: flex; flex-direction: column; }
    .dcard-body h3 { margin: 0 0 6px; font-size: 17px; letter-spacing: 2px; color: var(--ink); }
    .dcard-body p { margin: 0 0 12px; font-size: 12.5px; line-height: 1.85; color: var(--ink-soft); flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tag {
      font-size: 10px; letter-spacing: 1px;
      padding: 2px 7px; border: 1px solid var(--line); color: var(--ink-soft);
      background: color-mix(in srgb, var(--jade) 8%, transparent); color: var(--jade);
      border-radius: 2px;
    }
    .dcard-acts { display: flex; gap: 8px; }
    .dcard-acts a, .dcard-acts button {
      flex: 1; text-align: center; font-family: var(--serif); font-size: 12px; letter-spacing: 1.5px;
      padding: 6px 0; border: 1px solid var(--line); background: var(--paper-hi); color: var(--ink-soft);
      text-decoration: none; cursor: pointer; transition: .16s;
    }
    .dcard-acts a:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
    .dcard-acts button.vote { background: var(--cinnabar); border-color: var(--cinnabar); color: var(--seal-ink); }
    .dcard-acts button.vote:hover { background: var(--cinnabar-soft); }
    .dcard-acts button.voted { background: transparent; color: var(--cinnabar); border-color: var(--cinnabar); }
    .vote-hint { text-align: center; font-size: 11px; color: var(--gold); margin-top: 8px; letter-spacing: .5px; }

    .reset { text-align: center; margin-top: 18px; }
    .reset button {
      font-family: var(--serif); font-size: 11px; color: var(--gold);
      background: none; border: none; cursor: pointer; letter-spacing: 1px;
    }
    .reset button:hover { color: var(--cinnabar); }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--paper); font-size: 12px; letter-spacing: 1px;
      padding: 8px 18px; border-radius: 2px; opacity: 0; pointer-events: none; transition: opacity .3s;
      z-index: 3000;
    }
    .toast.show { opacity: .92; }

    @media (max-width: 640px) {
      .lab-head h1 { font-size: 22px; letter-spacing: 5px; }
      .rank-name { width: 110px; }
    }
  </style>
</head>
<body>
  <div class="tabstrip">
    <div class="tabrow tabrow-works">
      <a class="tabstrip-tab" href="index.html">诗渊</a>
      <a class="tabstrip-tab" href="https://classicalchinesepainting.com/">千里江山图</a>
    </div>
  </div>

  <div class="lab-wrap">
    <div class="lab-head">
      <h1>设计实验室</h1>
      <p>这里汇集了目前尝试的设计方向。点击卡片查看 live demo，喜欢就投一票。<br>
      投票只记录在你的浏览器里；选好后把本页链接或截图发给我们就行。</p>
    </div>

    <div class="share-row">
      <button id="copyLink">复制本页链接</button>
      <a href="playground.html" style="display:inline-block;font-family:var(--serif);font-size:12px;letter-spacing:2px;background:var(--cinnabar);border:1px solid var(--cinnabar);color:var(--seal-ink);padding:6px 18px;text-decoration:none;transition:.18s;">进入组合实验室 ›</a>
    </div>

    <div class="rank-panel" id="rankPanel">
      <h2>当前排行</h2>
      <div id="rankBody"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="reset"><button id="resetVotes">重置投票</button></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var DESIGNS = [
      {id:"texture", title:"素宣 + 印章 + 竖排", img:"assets/design/demo-texture.png",
       desc:"宣纸纹理、印章式筛选、首页竖排与墨显动画。", tags:["首页","素宣","动态"], demo:"demo-texture.html"},
      {id:"scroll", title:"手卷式首页", img:"assets/design/demo-scroll.png",
       desc:"把首页变成一幅可横向拖拽的卷轴，诗以竖排列从右向左展开。", tags:["首页","手卷","竖排"], demo:"demo-scroll.html"},
      {id:"scatter", title:"案头散页诗文库", img:"assets/design/demo-scatter.png",
       desc:"卡片像随手摊在桌上的诗笺，有轻微旋转与错落。", tags:["诗文库","散页","有机"], demo:"demo-scatter.html"},
      {id:"themes-su", title:"手卷 · 素宣", img:"assets/design/demo-themes-su.png",
       desc:"手卷基础上的素宣设色：白纸、墨字、朱砂印。", tags:["手卷","素宣","设色"], demo:"demo-themes.html?theme=su"},
      {id:"themes-mumo", title:"手卷 · 暮荷", img:"assets/design/demo-themes-mumo.png",
       desc:"暮色中的柔紫，灵感来自 Are.na 频道里的荷池意象。", tags:["手卷","暮荷","设色"], demo:"demo-themes.html?theme=mumo"},
      {id:"themes-summer", title:"手卷 · 夏昼", img:"assets/design/demo-themes-summer.png",
       desc:"明亮暖白与橙赭，像盛夏午后。", tags:["手卷","夏昼","设色"], demo:"demo-themes.html?theme=summer"},
      {id:"themes-qinglv", title:"手卷 · 青绿", img:"assets/design/demo-themes-qinglv.png",
       desc:"石青石绿，和千里江山图那个站同一家族。", tags:["手卷","青绿","设色"], demo:"demo-themes.html?theme=qinglv"},
      {id:"album", title:"册页式诗画对读", img:"assets/design/demo-album.png",
       desc:"左画右诗，像翻一本册页。适合 curated 配画的作品。", tags:["诗画","册页","沉浸"], demo:"demo-album.html"},
      {id:"moodboard", title:"诗画 Mood Board", img:"assets/design/demo-moodboard.png",
       desc:"Are.na 式的 masonry 墙，图片/色块与诗并列，适合主题 browsing。", tags:["诗画","mood board","browsing"], demo:"demo-moodboard.html"}
    ];

    var LS_KEY = "shiyuan_design_votes";
    function getVotes(){
      try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ return {}; }
    }
    function saveVotes(v){ localStorage.setItem(LS_KEY, JSON.stringify(v)); }
    function showToast(msg){
      var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
      setTimeout(function(){ t.classList.remove("show"); }, 1800);
    }

    function render(){
      var votes = getVotes();
      var grid = document.getElementById("grid");
      grid.innerHTML = DESIGNS.map(function(d){
        var count = votes[d.id] || 0;
        var voted = count > 0;
        return '<div class="dcard" data-id="' + d.id + '">' +
          '<img class="dcard-img" src="' + d.img + '" alt="' + d.title + '">' +
          '<div class="dcard-body">' +
            '<h3>' + d.title + '</h3>' +
            '<p>' + d.desc + '</p>' +
            '<div class="tags">' + d.tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join("") + '</div>' +
            '<div class="dcard-acts">' +
              '<a href="' + d.demo + '" target="_blank">查看 Demo</a>' +
              '<button class="vote' + (voted?' voted':'') + '" data-id="' + d.id + '">' + (voted?'已投 ' + count:'投一票') + '</button>' +
            '</div>' +
            '<div class="vote-hint">票数：' + count + '</div>' +
          '</div></div>';
      }).join("");

      grid.querySelectorAll("button.vote").forEach(function(b){
        b.addEventListener("click", function(){
          var id = b.getAttribute("data-id");
          var v = getVotes(); v[id] = (v[id] || 0) + 1; saveVotes(v);
          render(); showToast("已投给「" + DESIGNS.find(function(x){ return x.id === id; }).title + "」");
        });
      });

      renderRank(votes);
    }

    function renderRank(votes){
      var list = DESIGNS.map(function(d){ return {id:d.id, title:d.title, n:votes[d.id]||0}; })
        .filter(function(x){ return x.n > 0; }).sort(function(a,b){ return b.n - a.n; });
      var body = document.getElementById("rankBody");
      if (!list.length) { body.innerHTML = '<div class="rank-empty">还没有投票，点击下方卡片开始。</div>'; return; }
      var max = list[0].n;
      body.innerHTML = list.map(function(x){
        var pct = Math.round((x.n / max) * 100);
        return '<div class="rank-item"><div class="rank-name">' + x.title + '</div>' +
          '<div class="rank-bar-wrap"><div class="rank-bar" style="width:' + pct + '%"></div></div>' +
          '<div class="rank-count">' + x.n + '</div></div>';
      }).join("");
    }

    document.getElementById("copyLink").addEventListener("click", function(){
      var url = location.href.split("?")[0];
      navigator.clipboard.writeText(url).then(function(){ showToast("链接已复制"); }, function(){ showToast("复制失败，请手动复制"); });
    });

    document.getElementById("resetVotes").addEventListener("click", function(){
      if (confirm("确定重置所有投票吗？")) { localStorage.removeItem(LS_KEY); render(); showToast("投票已重置"); }
    });

    render();
  </script>
</body>
</html>
