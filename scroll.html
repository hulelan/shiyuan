<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>千里江山图 · 展卷</title>
  <meta name="description" content="王希孟《千里江山图》全卷高清，自右向左展卷阅览。">
  <link rel="stylesheet" href="css/shell.css">
  <style>
    :root { --paper:#f4efe4; --cinnabar:#a8322d; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #14120f; color: #d9cfba; overflow: hidden;
      font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }
    /* full-bleed horizontal viewer */
    #stage {
      position: fixed; inset: 0;
      height: 100vh; height: 100dvh;
      overflow-x: auto; overflow-y: hidden;
      white-space: nowrap; font-size: 0;
      cursor: grab;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      background:
        radial-gradient(120% 60% at 50% 0%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.55) 100%),
        #14120f;
    }
    #stage::-webkit-scrollbar { display: none; }
    #stage.grabbing { cursor: grabbing; }
    #stage img {
      height: 100vh; height: 100dvh;
      width: auto; display: inline-block; vertical-align: bottom;
      margin: 0; padding: 0; border: 0;
      -webkit-user-drag: none; user-select: none; pointer-events: none;
    }
    /* thin top/bottom silk framing so the scroll reads as a scroll */
    #stage::before, #stage::after { content: none; }

    /* caption + hint, both auto-fade */
    .caption {
      position: fixed; left: 18px; bottom: 16px; z-index: 1500;
      font-size: 15px; letter-spacing: 2px; color: #e7ddc9;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      transition: opacity .5s ease; pointer-events: none;
    }
    .caption small { display:block; font-size: 12px; color:#b7ab97; letter-spacing:1px; margin-top:2px; }
    .hint {
      position: fixed; left: 50%; top: 50%; z-index: 1500;
      transform: translate(-50%, -50%);
      padding: 12px 22px; border-radius: 999px;
      background: rgba(20,18,15,0.55); backdrop-filter: blur(3px);
      color: #efe7d5; font-size: 16px; letter-spacing: 3px;
      box-shadow: 0 4px 22px rgba(0,0,0,0.5);
      transition: opacity .6s ease; pointer-events: none;
    }
    .hint .arrow { display:inline-block; animation: nudge 1.4s ease-in-out infinite; }
    @keyframes nudge { 0%,100%{ transform:translateX(0) } 50%{ transform:translateX(-6px) } }
    .faded { opacity: 0 !important; }

    /* progress line along the bottom */
    .progress { position: fixed; left:0; bottom:0; height:3px; z-index:1600;
      background: linear-gradient(90deg, var(--cinnabar), #d9b45a);
      width:0; transition: width .08s linear; opacity:.85; }

    /* first-load veil */
    .veil { position: fixed; inset:0; z-index:1700; display:flex;
      align-items:center; justify-content:center; background:#14120f;
      color:#b7ab97; letter-spacing:4px; font-size:15px;
      transition: opacity .6s ease; }
    .veil.gone { opacity:0; pointer-events:none; }
    .veil .dot { animation: blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }
  </style>
</head>
<body class="scroll-page">
  <!-- cross-site tab strip -->
  <div class="tabstrip" id="tabstrip">
    <a class="tabstrip-tab" href="index.html">Cooking</a>
    <a class="tabstrip-tab active" href="scroll.html">千里江山图</a>
  </div>

  <div id="stage" aria-label="千里江山图 全卷"></div>

  <div class="caption" id="caption">《千里江山图》<small>王希孟　北宋　绢本设色</small></div>
  <div class="hint" id="hint"><span class="arrow">←</span>　向左展卷</div>
  <div class="progress" id="progress"></div>
  <div class="veil" id="veil">展卷中<span class="dot">…</span></div>

  <script src="assets/scroll/manifest.js"></script>
  <script>
  (function () {
    var stage = document.getElementById('stage');
    var S = window.SCROLL || { tiles: [] };
    var n = S.tiles.length;

    // build tiles edge-to-edge; eager-load the rightmost few (where we open)
    S.tiles.forEach(function (t, i) {
      var img = document.createElement('img');
      img.src = 'assets/scroll/tiles/' + t.f;
      img.width = t.w; img.height = S.h;      // intrinsic size → stable layout pre-load
      img.alt = '';
      img.loading = (i >= n - 4) ? 'eager' : 'lazy';
      img.decoding = 'async';
      stage.appendChild(img);
    });

    function toRight() { stage.scrollLeft = stage.scrollWidth; }  // open at far right
    requestAnimationFrame(function () { requestAnimationFrame(toRight); });
    window.addEventListener('load', toRight);
    var opened = false;
    window.addEventListener('resize', function () { if (!opened) toRight(); });

    // hide veil once the first (rightmost) tile paints
    var veil = document.getElementById('veil');
    var last = stage.querySelector('img:last-child');
    function drop() { veil.classList.add('gone'); }
    if (last) { last.complete ? drop() : last.addEventListener('load', drop); }
    setTimeout(drop, 4000); // safety

    // vertical wheel → advance leftward (unroll); leave trackpad h-swipe native
    stage.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      e.preventDefault();
      stage.scrollLeft -= e.deltaY;
      markMoved();
    }, { passive: false });

    // mouse drag-to-pan (desktop); touch keeps native momentum
    var down = false, startX = 0, startL = 0;
    stage.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch') return;
      down = true; opened = true; startX = e.clientX; startL = stage.scrollLeft;
      stage.classList.add('grabbing'); stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', function (e) {
      if (!down) return;
      stage.scrollLeft = startL - (e.clientX - startX);
      markMoved();
    });
    function up() { down = false; stage.classList.remove('grabbing'); }
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);

    // progress + fade chrome on first move
    var caption = document.getElementById('caption');
    var hint = document.getElementById('hint');
    var progress = document.getElementById('progress');
    var moved = false;
    function markMoved() {
      opened = true;
      if (!moved) { moved = true; hint.classList.add('faded');
        setTimeout(function(){ caption.classList.add('faded'); }, 2600); }
    }
    stage.addEventListener('scroll', function () {
      var max = stage.scrollWidth - stage.clientWidth;
      // right edge = start (0% seen), left edge = end (100% seen)
      var seen = max > 0 ? (1 - stage.scrollLeft / max) : 0;
      progress.style.width = (seen * 100).toFixed(2) + '%';
      markMoved();
    }, { passive: true });
    setTimeout(function(){ if(!moved) hint.classList.add('faded'); }, 6000);

    // auto-hide tab strip; reveal near top / on move
    var strip = document.getElementById('tabstrip');
    var hideT;
    function poke(y) {
      strip.classList.remove('tucked');
      clearTimeout(hideT);
      hideT = setTimeout(function () { strip.classList.add('tucked'); }, 2400);
    }
    poke();
    document.addEventListener('mousemove', function (e) { if (e.clientY < 90) poke(); });
    document.addEventListener('touchstart', function () { poke(); }, { passive: true });
  })();
  </script>
</body>
</html>
